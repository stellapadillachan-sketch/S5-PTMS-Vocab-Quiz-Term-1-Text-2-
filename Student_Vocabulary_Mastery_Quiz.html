<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; line-height: 1.5; }
        .container { max-width: 750px; margin: 0 auto; background: var(--card-bg); padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); }
        
        h1 { color: #0f172a; text-align: center; margin-bottom: 8px; font-size: 28px; font-weight: 800; }
        .subtitle { text-align: center; color: #64748b; font-size: 15px; margin-bottom: 30px; }
        
        /* Setup screen */
        #setup-screen { text-align: center; padding: 20px 0; }
        #setup-screen input { padding: 12px 16px; font-size: 16px; width: 80%; max-width: 350px; border: 2px solid var(--border-color); border-radius: 8px; margin-bottom: 20px; outline: none; transition: border-color 0.2s; }
        #setup-screen input:focus { border-color: var(--primary); }
        #start-btn { display: inline-block; background: var(--primary); color: white; border: none; padding: 12px 30px; font-size: 16px; font-weight: 700; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        #start-btn:hover { background: var(--primary-hover); }

        #quiz-app { display: none; }
        
        .score-banner { background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%); color: white; padding: 16px; text-align: center; font-size: 18px; font-weight: 700; border-radius: 12px; margin-bottom: 30px; position: sticky; top: 15px; z-index: 100; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2); display: flex; justify-content: space-between; align-items: center; padding-left: 24px; padding-right: 24px; }
        
        .question-card { background: #ffffff; border: 2px solid var(--border-color); border-radius: 12px; padding: 24px; margin-bottom: 24px; transition: all 0.25s ease; }
        .question-card.correct { border-color: #22c55e; background-color: #f0fdf4; }
        .question-card.incorrect { border-color: #ef4444; background-color: #fef2f2; }
        
        .question-title { font-weight: 700; font-size: 18px; margin-bottom: 16px; color: #0f172a; }
        
        .options { display: flex; flex-direction: column; gap: 10px; }
        .options label { display: flex; align-items: center; padding: 12px 16px; background: #f8fafc; border: 1.5px solid var(--border-color); border-radius: 8px; cursor: pointer; transition: all 0.2s; font-size: 15px; font-weight: 500; }
        .options label:hover:not(.disabled) { background: #f1f5f9; border-color: #cbd5e1; }
        .options label.disabled { cursor: default; }
        
        .options label.correct-ans { background: #dcfce7 !important; border-color: #22c55e !important; color: #166534; font-weight: 600; }
        .options label.wrong-ans { background: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b; text-decoration: line-through; }
        
        .options input { margin-right: 12px; transform: scale(1.1); accent-color: var(--primary); }
        
        .feedback { margin-top: 14px; font-weight: 700; font-size: 15px; }

        /* Completion Report Card */
        #completion-card { display: none; background: #eff6ff; border: 2px solid #3b82f6; border-radius: 12px; padding: 30px; text-align: center; margin-top: 30px; }
        #completion-card h2 { color: #1e3a8a; margin-top: 0; }
        #completion-card p { font-size: 18px; font-weight: 600; color: #1e293b; }
        
        .action-btns { display: flex; gap: 12px; margin-top: 30px; }
        .btn { flex: 1; background: #0f172a; color: white; border: none; padding: 16px; font-size: 16px; font-weight: 700; border-radius: 12px; cursor: pointer; transition: background 0.2s; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15); }
        .btn:hover { background: #1e293b; }
        .btn-secondary { background: #475569; }
        .btn-secondary:hover { background: #334155; }
    </style>

<body>

    <!-- Student Setup Screen -->

        <br>
        <button id="start-btn" onclick="startQuiz()">Start Quiz</button>
    </div>

    <!-- Quiz App Screen -->
    <div id="quiz-app">
        <div class="score-banner" id="score-banner">

            <span id="banner-score">Score: 0 / 75 (0 answered)</span>
        </div>
        
        <div id="quiz-container"></div>

        <div id="completion-card">
            <h2>🎉 Quiz Completed!</h2>
            <p id="final-result-text"></p>
            <p style="font-size: 14px; color: #64748b;">You can take a screenshot of this summary and send it to your tutor/teacher.</p>
        </div>
        
        <div class="action-btns">
            <button class="btn btn-secondary" onclick="location.reload()">🔄 Retake (Shuffle Again)</button>
        </div>
    </div>

let studentName = "";
let score = 0;
let answeredCount = 0;

function shuffleArray(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex != 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
}

function startQuiz() {
    let nameInput = document.getElementById('student-name').value.trim();
    if (!nameInput) {
        alert("Please enter your name to start the quiz.");
        return;
    }
    studentName = nameInput;
    document.getElementById('banner-name').textContent = studentName;
    
    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('quiz-app').style.display = 'block';

    buildQuiz();
}

function buildQuiz() {
    let randomizedData = shuffleArray([...rawQuizData]);
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';

    randomizedData.forEach((item, qIdx) => {
        let optionsWithMeta = item.options.map((optText, oIdx) => ({
            text: optText,
            isCorrect: oIdx === item.answer
        }));
        
        shuffleArray(optionsWithMeta);
        
        let card = document.createElement('div');
        card.className = 'question-card';
        card.id = `card-${qIdx}`;
        
        let html = `<div class="question-title">${qIdx + 1}. ${item.q}</div><div class="options" id="opts-${qIdx}">`;
        optionsWithMeta.forEach((opt, oIdx) => {
            let inputId = `q${qIdx}-o${oIdx}`;
            html += `<label id="label-${inputId}"><input type="radio" name="q${qIdx}" id="${inputId}" value="${opt.isCorrect}" onchange="checkAnswer(${qIdx}, '${inputId}')"> ${String.fromCharCode(65 + oIdx)}) ${opt.text}</label>`;
        });
        html += `</div><div class="feedback" id="feedback-${qIdx}"></div>`;
        card.innerHTML = html;
        container.appendChild(card);
    });
}

function checkAnswer(qIdx, inputId) {
    let card = document.getElementById(`card-${qIdx}`);
    let optsDiv = document.getElementById(`opts-${qIdx}`);
    let feedback = document.getElementById(`feedback-${qIdx}`);
    let radios = optsDiv.getElementsByTagName('input');
    
    let selectedRadio = document.getElementById(inputId);
    let isCorrect = (selectedRadio.value === "true");

    for (let r of radios) {
        r.disabled = true;
        let lbl = document.getElementById(`label-${r.id}`);
        lbl.classList.add('disabled');
        if (r.value === "true") {
            lbl.classList.add('correct-ans');
        } else if (r.checked) {
            lbl.classList.add('wrong-ans');
        }
    }

    if (isCorrect) {
        score++;
        card.className = "question-card correct";
        feedback.style.color = "#166534";
        feedback.innerHTML = "✅ Correct!";
    } else {
        card.className = "question-card incorrect";
        feedback.style.color = "#991b1b";
        feedback.innerHTML = "❌ Incorrect.";
    }

    answeredCount++;
    document.getElementById('banner-score').textContent = `Score: ${score} / 75 (${answeredCount} answered)`;

    if (answeredCount === 75) {
        let completionCard = document.getElementById('completion-card');
        let percentage = Math.round((score / 75) * 100);
        document.getElementById('final-result-text').textContent = `${studentName}, you scored ${score} out of 75 (${percentage}%)!`;
        completionCard.style.display = 'block';
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
}
